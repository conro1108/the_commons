<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Commons</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 320px;
             background: #8ec572; color: #402e3a; font: 14px/1.45 ui-monospace, monospace; }
      #field { display: grid; place-items: center; overflow: hidden; padding: 12px; }
      canvas { image-rendering: pixelated; cursor: pointer; }
      aside { background: #f6f1dc; border-left: 3px solid #402e3a; padding: 14px 16px; overflow-y: auto; }
      h1 { font-size: 18px; margin: 0 0 2px; }
      h2 { font-size: 14px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
      p { margin: 6px 0; }
      q { font-style: italic; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { margin: 0 0 8px; }
      .hint, .meta { color: #7a6a8a; }
      .stamp { display: inline-block; font-weight: bold; text-transform: uppercase; font-size: 12px;
               border: 2px solid currentColor; padding: 0 5px; transform: rotate(-2deg); margin: 4px 0; }
      .approved, .conditional { color: #3d7a3a; }
      .committee, .pending { color: #b07a1e; }
      .denied, .lost { color: #b5404f; }
      .permit { background: #fffdf3; border: 1px dashed #c9b88f; padding: 6px 8px; }
      textarea { width: 100%; font: inherit; padding: 6px; border: 2px solid #402e3a; background: #fffdf3; resize: vertical; }
      button { font: inherit; font-weight: bold; margin-top: 6px; padding: 4px 10px; border: 2px solid #402e3a;
               background: #ffe9a8; cursor: pointer; }
      button:disabled { opacity: .5; }
      #problem { color: #b5404f; }
      #here { margin-top: 4px; }
      @media (max-width: 760px) {
        body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
        aside { border-left: 0; border-top: 3px solid #402e3a; }
      }
    </style>
  </head>
  <body>
    <main id="field"><canvas></canvas></main>
    <aside>
      <h1>The Commons</h1>
      <p class="meta">Administered by Gary.</p>
      <p id="here" class="meta"></p>
      <section id="plot"><p class="hint">Opening the gate…</p></section>
      <form id="claim" hidden>
        <textarea rows="2" maxlength="120" placeholder="a bench, for looking at the pond with" required></textarea>
        <button>Submit to Gary</button>
        <p id="problem"></p>
      </form>
      <section id="mine"></section>
      <section id="board"></section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
