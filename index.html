<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>The Commons</title>
    <link rel="icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="The Commons" />
    <meta name="theme-color" content="#1b2622" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; background: #1b2622; color: #402e3a;
             font: 14px/1.45 ui-monospace, monospace; }
      #field { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
      canvas { display: block; image-rendering: pixelated; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
      button, .notice { touch-action: manipulation; }
      h1 { font-size: 16px; margin: 0; }
      h2 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
      h3 { font-size: 11px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .06em; color: #7a6a8a; }
      p { margin: 6px 0; }
      q { font-style: italic; }
      [hidden] { display: none !important; }
      .hint, .meta { color: #7a6a8a; }
      .stamp { display: inline-block; font-weight: bold; text-transform: uppercase; font-size: 12px;
               border: 2px solid currentColor; padding: 0 5px; transform: rotate(-2deg); margin: 4px 0; }
      .approved, .conditional { color: #3d7a3a; }
      .committee, .pending { color: #b07a1e; }
      .denied, .refused, .lost { color: #b5404f; }
      .refused { border-width: 3px; }
      .stamp.thunk { animation: thunk .45s cubic-bezier(.3, 1.6, .5, 1) both; }
      @keyframes thunk {
        from { transform: scale(2.4) rotate(-14deg); opacity: 0; }
        60% { transform: scale(.92) rotate(-1deg); opacity: 1; }
        to { transform: rotate(-2deg); }
      }
      .permit { background: #fbf4dc; border: 1px dashed #c9b88f; padding: 6px 8px; }
      textarea { width: 100%; font: inherit; padding: 6px; border: 2px solid #402e3a; background: #fbf4dc; resize: vertical; }
      button { font: inherit; font-weight: bold; margin-top: 6px; padding: 4px 10px; border: 2px solid #402e3a;
               background: #ffe9a8; color: inherit; cursor: pointer; box-shadow: 2px 2px 0 #402e3a; }
      button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #402e3a; }
      button:disabled { opacity: .5; }
      .problem { color: #b5404f; }
      .filed-by { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
      .filed-by input { flex: 1; min-width: 0; font: inherit; padding: 2px 6px; border: 2px solid #402e3a; background: #fbf4dc; }

      /* Paper: everything the commons tells you is written on some. */
      .paper { position: absolute; background: #fffdf3; border: 2px solid #402e3a; box-shadow: 3px 3px 0 #402e3a;
               padding: 10px 12px; }
      .close { position: absolute; top: 2px; right: 4px; margin: 0; padding: 0 6px; border: 0; background: none;
               box-shadow: none; font-size: 16px; color: #7a6a8a; }

      #tag { top: 12px; left: 12px; width: 250px; transform: rotate(-.5deg); padding: 8px 12px; }
      #tag .yours { margin: 6px 0 0; }
      .swatch { display: inline-block; width: 10px; height: 10px; border: 2px solid #402e3a; margin-right: 6px; vertical-align: -1px; }
      .plot-link { margin: 2px 2px 0 0; padding: 0 6px; background: #fffdf3; border-color: currentColor; box-shadow: none; }

      #card { width: 290px; transform: rotate(-.6deg); animation: pop .18s ease-out; cursor: grab; }
      #card :is(button, input, textarea, a, label) { cursor: auto; }
      #card button { cursor: pointer; }
      #card .bar { float: right; display: flex; margin: -8px -10px 0 6px; }
      #card .bar button { position: static; margin: 0; padding: 0 6px; border: 0; background: none; box-shadow: none; font-size: 16px; color: #7a6a8a; }
      #card.folded, #card.folded:has(.schedule) { width: auto; max-width: 290px; }
      #card.folded h2 { margin: 0; }
      @keyframes pop { from { transform: translateY(6px) rotate(-2deg) scale(.96); opacity: 0; } }
      .condition { background: #fbf4dc; border: 1px dashed #c9b88f; padding: 4px 8px; margin: 8px 0; }
      .where { margin-top: -4px; font-style: italic; }

      /* The letter (src/letter.ts): Gary's questionnaire, red tags, the pound. */
      .letter .form-no { margin: 0 0 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: #7a6a8a; }
      .letter .questionnaire.here { border: 2px solid #b07a1e; }
      .letter .red { border-color: #c8473c; }
      #pound { top: 50%; left: 50%; width: 300px; transform: translate(-50%, -50%) rotate(.4deg); animation: pop .18s ease-out; }
      #pound ul { list-style: none; padding: 0; margin: 8px 0; }
      #pound li { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      #pound li img { image-rendering: pixelated; width: 32px; }
      #pound li > span { flex: 1; }
      #pound .reclaim { margin: 0; }

      /* An unclaimed plot's particulars, as a schedule to a deed. */
      #card:has(.schedule) { width: 330px; }
      .schedule .form-no { display: flex; justify-content: space-between; margin: 0 0 4px; font-size: 10px;
                           text-transform: uppercase; letter-spacing: .14em; color: #7a6a8a; }
      .schedule h2 { font-size: 15px; text-transform: none; letter-spacing: .01em; border-bottom: 3px double #402e3a;
                     padding-bottom: 6px; margin-bottom: 8px; }
      .deed { display: flex; gap: 12px; align-items: flex-start; }
      .deed .shape { flex: none; image-rendering: pixelated; width: auto; height: auto; max-width: 132px; max-height: 96px;
                     zoom: 3; border: 0; filter: drop-shadow(1px 1px 0 #402e3a) drop-shadow(-1px -1px 0 #402e3a); }
      .deed dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; font-size: 12px; }
      .deed dt { color: #7a6a8a; text-transform: uppercase; font-size: 10px; letter-spacing: .08em; line-height: 18px; }
      .deed dd { margin: 0; line-height: 18px; }
      .blurb { font-style: italic; margin: 8px 0 4px; }
      .particulars { margin: 4px 0; padding-left: 20px; font-size: 12px; }
      .particulars li { margin: 2px 0; }
      .particulars li::marker { color: #7a6a8a; font-size: 11px; }
      .covenant { background: #fbf4dc; border-left: 3px solid #b07a1e; padding: 4px 8px; font-size: 12px; margin: 8px 0; }
      .intent { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7a6a8a; margin-top: 10px; }
      .intent textarea { margin-top: 3px; text-transform: none; letter-spacing: normal; color: #402e3a; font-size: 14px; }
      .condition .stamp { margin: 2px 6px 2px 0; }
      /* A permit's schedule (src/permit.ts). */
      .works { border-top: 3px double #402e3a; border-bottom: 1px solid #c9b88f; margin: 8px 0; padding: 6px 0 4px; }
      .works dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
      .works dt { color: #7a6a8a; text-transform: uppercase; font-size: 10px; letter-spacing: .08em; line-height: 17px; }
      .works dd { margin: 0; line-height: 17px; }
      .works i { color: #7a6a8a; }
      .vary select { font: inherit; margin-left: 6px; }

      #bubble { padding: 6px 10px; max-width: 240px; transform: translate(-50%, -100%); font-size: 13px;
                border-radius: 2px; pointer-events: none; animation: pop .15s ease-out; }
      #bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 8px; height: 8px; margin-left: -4px;
                       background: #fffdf3; border: 2px solid #402e3a; border-top: 0; border-left: 0; transform: rotate(45deg); }
      #nametag { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-size: 11px;
                 background: #402e3acc; color: #fffdf3; padding: 0 5px; white-space: nowrap; }

      /* The notice board, up close. */
      #board { position: absolute; inset: 0; background: #402e3a59; display: grid; place-items: center; }
      .cork { position: relative; width: min(780px, 94vw); max-height: 88vh; max-height: 88dvh; overflow-y: auto; padding: 0 18px 22px;
              background: radial-gradient(#b8894f 1px, transparent 1.5px) 0 0 / 7px 7px, radial-gradient(#d9b47c 1px, transparent 1.5px) 3px 4px / 9px 9px, #c9a06a;
              border: 12px solid #7a5230; outline: 2px solid #402e3a; box-shadow: 6px 6px 0 #402e3a; animation: pop .2s ease-out; }
      .plank { position: sticky; top: 0; z-index: 1; margin: 0 -18px 18px; padding: 8px 18px; background: #a97048;
               border-bottom: 2px solid #402e3a; color: #fffdf3; display: flex; justify-content: space-between; align-items: baseline; }
      .plank h2 { margin: 0; font-size: 15px; letter-spacing: .2em; }
      .plank .close { position: static; color: #fffdf3; }
      .pins { display: flex; flex-wrap: wrap; gap: 20px 16px; justify-content: center; }
      .notice { position: relative; width: 160px; background: #fffdf3; border: 2px solid #402e3a; padding: 12px 10px 8px;
                box-shadow: 2px 3px 0 #402e3a66; transform: rotate(var(--r)); cursor: pointer; font-size: 12px;
                transition: transform .12s; }
      .notice:hover { transform: rotate(0) translateY(-3px) scale(1.04); z-index: 1; }
      .notice q { display: block; margin: 4px 0; }
      .pin { position: absolute; top: -6px; left: calc(50% - 6px); width: 12px; height: 12px; border-radius: 50%;
             border: 2px solid #402e3a; }
      .reading { position: absolute; inset: 0; display: grid; place-items: center; background: #402e3a40; }
      .reading .notice { width: min(420px, 86vw); cursor: auto; font-size: 14px; padding: 16px 16px 12px; transform: rotate(-1deg); }
      .reading .notice:hover { transform: rotate(-1deg); }
      .empty-board { color: #fffdf3; text-align: center; padding: 30px 0 10px; }

      /* Up close, and inside: a row along the top (back, the place's paper, step inside), the dock along the bottom. */
      #build, #room { position: absolute; inset: 0; pointer-events: none; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .item-label { position: absolute; transform: translate(-50%, -100%); font-size: 11px; white-space: nowrap;
                    background: #402e3acc; color: #fffdf3; padding: 0 5px; }
      .topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
      .topbar > * { pointer-events: auto; }
      .topbar > button { flex: none; margin: 0; }
      .back { padding: 5px 12px; background: #fffdf3; }
      .go { margin-left: auto !important; padding: 6px 16px; font-size: 15px; background: #ffd66b; }
      .info { position: relative; width: 300px; padding: 0; transform: rotate(-.4deg); max-height: calc(100dvh - 210px); overflow-y: auto; }
      .info-head { display: flex; align-items: baseline; gap: 8px; width: 100%; margin: 0; padding: 7px 12px; border: 0; background: none;
                   box-shadow: none; text-align: left; font-weight: normal; }
      button.info-head:active { transform: none; box-shadow: none; }
      .info-head h2 { flex: 1; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .info-head .flag { flex: none; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #b07a1e; }
      .info-head .caret { flex: none; color: #7a6a8a; font-size: 11px; }
      .info-body { padding: 0 12px 10px; }
      .info-body > :first-child { margin-top: 0; }
      .info.folds:not(.open) .info-body { display: none; }

      /* The dock: one group's things in the tray, its tab lit below; the tools in a row above, to the right. */
      .tools { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(960px, calc(100% - 24px));
               display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
      .tool-row { display: flex; align-items: flex-end; gap: 10px; min-height: 30px; }
      .tool-row > *, .palette { pointer-events: auto; }
      .caption { flex: 1; min-width: 0; margin: 0 0 4px; font-size: 12px; color: #e9e2cf; text-shadow: 1px 1px 0 #1b2622; }
      .caption .problem { color: #ffb4a6; }
      .caption .problem:not(:empty)::before { content: " "; }
      .rail { position: relative; display: flex; gap: 2px; margin-left: auto; padding: 3px; }
      .rail button, .dock .tab { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px;
                                 padding: 5px 6px 3px; border: 0; background: none; box-shadow: none; font-weight: normal; font-size: 10.5px;
                                 color: #7a6a8a; white-space: nowrap; }
      .rail button { min-width: 58px; }
      .rail button.on, .dock .tab.on { background: #ffe9a8; color: #402e3a; font-weight: bold; box-shadow: inset 0 0 0 2px #402e3a; }
      .rail button:active, .dock .tab:active { transform: none; box-shadow: inset 0 0 0 2px #402e3a; }
      .rail .size b { font-size: 15px; line-height: 22px; }
      .palette { position: relative; padding: 0; }
      .tray { display: flex; align-items: center; gap: 4px; min-height: 92px; padding: 10px 12px 6px; overflow-x: auto;
              overscroll-behavior-x: contain; scrollbar-width: none; }
      .dock { display: flex; gap: 2px; padding: 4px 6px 6px; border-top: 1px dashed #c9b88f; overflow-x: auto; scrollbar-width: none; }
      .tray::-webkit-scrollbar, .dock::-webkit-scrollbar { display: none; }
      .tray::before, .tray::after { content: ""; flex: 1 1 0; } /* centred while it fits, scrolls from the left once it doesn't */
      .dock .tab { flex: 1 0 auto; min-width: 66px; position: relative; }
      .dock .tab .pic { height: 32px; }
      .dock .tab.wanted::after { content: ""; position: absolute; top: 4px; right: 8px; width: 7px; height: 7px; background: #b07a1e; border: 1px solid #402e3a; }
      .dock .gap { flex: none; width: 1px; margin: 6px 6px; border-left: 1px dashed #c9b88f; }
      .pic { display: grid; place-items: end center; }
      .pic img { display: block; image-rendering: pixelated; }
      .tray .item { flex: none; margin: 0; width: 78px; height: 76px; display: flex; flex-direction: column; align-items: center;
                    justify-content: flex-end; gap: 6px; padding: 4px 2px; border: 2px solid transparent; background: none; box-shadow: none;
                    font-weight: normal; font-size: 10.5px; color: #7a6a8a; }
      .tray .item:hover { background: #fbf4dc; }
      .tray .item:active { transform: none; box-shadow: none; }
      .tray .item.on { background: #ffe9a8; border-color: #402e3a; color: #402e3a; font-weight: bold; }
      .tray .item.wanted { border: 2px dashed #b07a1e; }
      .tray .item .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tray .item.go-item { width: auto; padding: 4px 14px; }
      .tray .item.quiet .name { color: #b5404f; }
      .tray .empty { margin: 0 auto; color: #7a6a8a; font-size: 12px; text-align: center; }
      .tray .cluster { flex: none; display: flex; flex-direction: column; justify-content: center; gap: 6px; align-self: stretch; padding: 0 10px; }
      .tray .cluster + .cluster { border-left: 1px dashed #c9b88f; }
      .tray .cluster:first-child { padding-left: 0; }
      .tray .cluster h3 { margin: 0; }
      .tray .cluster .row { display: flex; align-items: center; gap: 4px; }
      .tray .cluster .grid { display: grid; grid-template-columns: repeat(4, auto); gap: 2px; }
      .group-items { display: contents; }
      .tray .swatch-btn { margin: 0; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; background: none;
                          box-shadow: none; border: 2px solid transparent; }
      .tray .swatch-btn.on { border-color: #402e3a; background: #ffe9a8; }
      .tray .swatch-btn:active { transform: none; }
      .tray .swatch-btn span { width: 18px; height: 18px; border: 2px solid #402e3a; }
      .tray .swatch-btn img { width: 20px; image-rendering: pixelated; }
      .write-in { display: flex; gap: 6px; align-items: center; }
      .write-in input { width: 12em; font: inherit; padding: 5px 8px; border: 2px solid #402e3a; background: #fffdf3; }
      .write-in button { margin: 0; }
      .write-in.on input { background: #ffe9a8; }
      .tray .write-in { flex: none; padding: 0 8px; }
      .tray .sign-in { padding: 0; }
      .tray .sign-in input { width: 9em; }
      .tray .sign-status { font-size: 11px; }
      .tray .cluster > .meta { margin: 0; font-size: 11px; white-space: normal; max-width: 34em; }
      .tray .cluster:has(.write-in:not(.sign-in)) { flex: 0 1 auto; }

      /* Phones: papers out of the way of the map, and the toolbar one swipeable row. */
      @media (max-width: 600px), (max-height: 500px) {
        body { font-size: 13px; }
        #tag { width: auto; max-width: min(320px, calc(100% - 24px)); font-size: 12px; padding: 6px 10px; }
        .info { font-size: 12px; }
        .info-body .hint { display: none; }
        textarea, input { font-size: 16px; } /* any smaller and iOS zooms the page in to type */
      }
      @media (max-width: 600px) {
        #tag { top: auto; bottom: 12px; }
        /* Up close on a phone: one row along the top, the dock a sheet along the bottom, the place's paper dropping down over the plot. */
        .wide { display: none; }
        .topbar { top: 8px; left: 8px; right: 8px; gap: 6px; }
        .back { font-size: 16px; padding: 4px 13px; }
        .go { font-size: 14px; padding: 5px 12px; }
        .info { flex: 1; min-width: 0; width: auto; transform: none; max-height: calc(100dvh - 140px); }
        /* Unfolded, the paper is a sheet across the top, over the plot, till it's folded again. */
        .info.folds.open { position: absolute; top: 46px; left: 0; right: 0; z-index: 2; box-shadow: 0 4px 0 #402e3a66; }
        .info.open .info-head { position: sticky; top: 0; background: #fffdf3; border-bottom: 1px dashed #c9b88f; margin-bottom: 8px; }
        .info-head { padding: 7px 10px; }
        .info-body { padding: 0 10px 10px; }
        .tools { left: 0; right: 0; bottom: 0; width: auto; transform: none; gap: 4px; }
        .tool-row { padding: 0 8px; flex-wrap: wrap; row-gap: 4px; }
        .caption { flex-basis: 100%; order: -1; margin: 0; text-align: center; }
        .info-head h2 { text-transform: none; letter-spacing: 0; font-size: 13px; }
        .palette { border-width: 2px 0 0; box-shadow: none; padding-bottom: env(safe-area-inset-bottom); }
        .tray { padding: 8px 8px 4px; min-height: 88px; }
        .tray .item { width: 68px; }
        .tray .write-in input { flex: 1; min-width: 0; width: auto; }
        .dock .tab { min-width: 62px; }
        .caption { font-size: 11.5px; }
        /* The card as a sheet along the bottom, leaving the map above it to walk on. */
        #card, #card:has(.schedule) { left: 0; right: 0; bottom: 0; width: auto; max-height: 50dvh; overflow-y: auto;
                                      transform: none; border-width: 2px 0 0; box-shadow: 0 -3px 0 #402e3a33; }
        #card { cursor: auto; }
        #field:has(#card:not([hidden])) #tag { display: none; }
        #card .bar { position: sticky; top: 0; }
        #card .bar button { font-size: 20px; padding: 0 8px; }
        #card.folded { max-width: none; }
        .fold summary { cursor: pointer; color: #7a6a8a; }
        .fold .condition { margin-top: 4px; }
      }
      @media (max-height: 500px) {
        #tag .hint { display: none; }
        /* A phone on its side: the dock in pictures only (names on a long press or hover), so the plot keeps the height. */
        .topbar { top: 6px; }
        .tools { bottom: 6px; gap: 4px; }
        .tool-row { min-height: 0; }
        .tray { min-height: 0; padding: 4px 8px 2px; }
        .tray .item { width: 50px; height: 48px; padding: 2px; }
        .tray .item .name, .dock .tab .name, .rail button .name { display: none; }
        .tray .cluster h3 { display: none; }
        .dock { padding: 2px 4px 3px; }
        .dock .tab { min-width: 44px; padding: 3px; }
        .rail button { min-width: 40px; padding: 4px; }
      }

      /* Form R-1: your papers, over the commons. */
      #papers { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); padding: 16px;
                background: #2e3a2a99; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .2s ease-out; }
      @keyframes fade { from { opacity: 0; } }
      .papers { position: relative; width: min(760px, 100%); max-height: 100%; overflow: auto; overscroll-behavior: contain;
                background: #fffdf3; border: 2px solid #402e3a; box-shadow: 5px 6px 0 #402e3a;
                padding: 22px 26px 18px; animation: pop .25s ease-out;
                background-image: repeating-linear-gradient(#fffdf3 0 27px, #f1ead2 27px 28px); }
      .papers header { border-bottom: 3px double #402e3a; padding-bottom: 10px; margin-bottom: 4px; }
      .papers .form-no { display: flex; justify-content: space-between; margin: 0 0 6px; font-size: 11px;
                         text-transform: uppercase; letter-spacing: .14em; color: #7a6a8a; }
      .papers h1 { font-size: 28px; letter-spacing: .04em; }
      .papers header .meta { margin: 4px 0 0; }
      .papers section { padding: 14px 0 4px; border-bottom: 1px dashed #c9b88f; }
      .papers section:last-of-type { border-bottom: 0; }
      .papers h2 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .sec { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 2px solid #402e3a;
             background: #ffe9a8; font-size: 12px; }
      .kinds { display: inline-flex; border: 2px solid #402e3a; box-shadow: 2px 2px 0 #402e3a; margin-bottom: 12px; }
      .kinds button { margin: 0; border: 0; box-shadow: none; background: #fffdf3; font-weight: normal; padding: 5px 14px; }
      .kinds button + button { border-left: 2px solid #402e3a; }
      .kinds button[aria-selected=true] { background: #ffe9a8; font-weight: bold; }
      .kinds button:active { transform: none; }
      .meadow { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; }
      .creature { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px 8px;
                  background: #fffdf3; font-weight: normal; text-align: center; box-shadow: 2px 2px 0 #402e3a; transition: transform .12s; }
      .creature canvas { image-rendering: pixelated; width: 64px; height: 64px; margin-bottom: 4px; }
      .creature b { font-size: 12px; line-height: 1.2; }
      .creature small { font-size: 10.5px; line-height: 1.3; color: #7a6a8a; }
      .creature:hover { transform: translateY(-2px); }
      .creature.on { background: #ffe9a8; box-shadow: 3px 3px 0 #402e3a; outline: 2px solid #402e3a; outline-offset: 2px; }
      .creature.on canvas { animation: hop .5s steps(2) infinite; }
      @keyframes hop { 50% { transform: translateY(-4px); } }
      .creature.filled { border: 2px dashed #9a9cb0; box-shadow: none; opacity: .7; cursor: default; }
      .creature.filled:hover { transform: none; }
      .creature.filled small { color: #b5404f; font-weight: bold; text-transform: uppercase; letter-spacing: .06em; }
      .maker { display: grid; grid-template-columns: 184px 1fr; gap: 18px; align-items: start; }
      .stage { position: sticky; top: 0; display: grid; justify-items: center; gap: 8px; padding: 12px 10px 10px;
               border: 2px solid #402e3a; box-shadow: 2px 2px 0 #402e3a;
               background: linear-gradient(#cfe9f2 0 62%, #b2d878 62% 100%); }
      .stage canvas { image-rendering: pixelated; width: 160px; height: 152px; }
      .stage .shuffle { margin: 0; width: 100%; background: #fffdf3; }
      .part { margin-bottom: 10px; }
      .part h3 { margin-bottom: 5px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { margin: 0; padding: 0; box-shadow: 1px 1px 0 #402e3a; background: #fffdf3; }
      .chip[aria-checked=true] { outline: 2px solid #402e3a; outline-offset: 2px; background: #ffe9a8; }
      .swatch-chip { width: 26px; height: 26px; background: var(--c); }
      .swatch-chip[aria-checked=true] { background: var(--c); }
      .style-chip { display: grid; place-items: center; width: 34px; height: 40px; }
      .style-chip canvas { image-rendering: pixelated; width: 24px; height: 32px; }
      .papers input[name=name] { width: 100%; font: inherit; font-size: 18px; padding: 6px 2px; border: 0;
                                 border-bottom: 2px solid #402e3a; background: transparent; outline: none; }
      .papers input[name=name]:focus { border-bottom-color: #b07a1e; background: #fff6d8; }
      .link { margin: 0; padding: 0; border: 0; background: none; box-shadow: none; font-weight: normal; text-decoration: underline; color: #7a6a8a; }
      .papers footer { padding-top: 6px; }
      .door .actions { margin-top: 8px; }
      .papers .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
      .papers .actions button { margin: 0; padding: 7px 16px; }
      .papers .submit { font-size: 15px; background: #ffd66b; }
      .approved-stamp { position: absolute; inset: 0; display: grid; place-items: center; background: #fffdf3aa; }
      .approved-stamp .stamp { font-size: 42px; padding: 4px 18px; border-width: 5px; background: #fffdf3; }
      @media (prefers-reduced-motion: reduce) { #papers, .papers, .creature.on canvas { animation: none; } }
      @media (max-width: 600px) {
        #papers { padding: 0; align-items: end; }
        .papers { padding: 16px 14px 14px; box-shadow: none; border-width: 2px 0 0; max-height: 100dvh; }
        .papers h1 { font-size: 22px; }
        .maker { grid-template-columns: 1fr; }
        .stage { position: static; }
        .meadow { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        .papers .actions button { flex: 1; }
      }
    </style>
  </head>
  <body>
    <main id="field">
      <canvas></canvas>
      <div id="tag" class="paper"><h1>The Commons</h1><p class="meta">Opening the gate…</p></div>
      <div id="card" class="paper" hidden></div>
      <div id="bubble" class="paper" hidden></div>
      <div id="nametag" hidden></div>
      <section id="build" hidden>
        <div id="labels"></div>
        <div class="topbar">
          <button id="leave" class="back" title="Back to the commons">←<span class="wide"> The commons</span></button>
          <div id="build-info" class="paper info"></div>
          <button id="go-in" class="go" hidden>Step inside →</button>
        </div>
        <div id="tools" class="tools" hidden>
          <div class="tool-row"><p id="tool-line" class="caption"><span id="tool-hint"></span><span id="build-problem" class="problem"></span></p><div id="rail" class="paper rail"></div></div>
          <div class="paper palette"><div id="tray" class="tray"></div><nav id="dock" class="dock"></nav></div>
        </div>
      </section>
      <section id="room" hidden>
        <div class="topbar">
          <button id="room-leave" class="back" title="Back outside">←<span class="wide"> Outside</span></button>
          <div id="room-info" class="paper info"></div>
        </div>
        <div id="room-tools" class="tools" hidden>
          <div class="tool-row"><p class="caption"><span id="room-hint"></span><span id="room-problem" class="problem"></span></p><div id="room-rail" class="paper rail"></div></div>
          <div class="paper palette"><div id="room-tray" class="tray"></div><nav id="room-dock" class="dock"></nav></div>
        </div>
      </section>
      <div id="board" hidden></div>
    </main>
    <div id="papers" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
