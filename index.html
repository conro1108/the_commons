<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Commons</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 320px;
             background: #8ec572; color: #402e3a; font: 14px/1.45 ui-monospace, monospace; }
      #field { overflow: hidden; min-height: 0; }
      canvas { display: block; image-rendering: pixelated; touch-action: none; }
      aside { background: #f6f1dc; border-left: 3px solid #402e3a; padding: 14px 16px; overflow-y: auto; }
      h1 { font-size: 18px; margin: 0 0 2px; }
      h2 { font-size: 14px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
      p { margin: 6px 0; }
      q { font-style: italic; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { margin: 0 0 8px; }
      .hint, .meta { color: #7a6a8a; }
      .stamp { display: inline-block; font-weight: bold; text-transform: uppercase; font-size: 12px;
               border: 2px solid currentColor; padding: 0 5px; transform: rotate(-2deg); margin: 4px 0; }
      .approved, .conditional { color: #3d7a3a; }
      .committee, .pending { color: #b07a1e; }
      .denied, .refused, .lost { color: #b5404f; }
      .refused { border-width: 3px; }
      .permit { background: #fffdf3; border: 1px dashed #c9b88f; padding: 6px 8px; }
      textarea { width: 100%; font: inherit; padding: 6px; border: 2px solid #402e3a; background: #fffdf3; resize: vertical; }
      button { font: inherit; font-weight: bold; margin-top: 6px; padding: 4px 10px; border: 2px solid #402e3a;
               background: #ffe9a8; cursor: pointer; }
      button:disabled { opacity: .5; }
      #problem, #build-problem { color: #b5404f; }
      h3 { font-size: 11px; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .06em; color: #7a6a8a; }
      #palette .row { display: flex; flex-wrap: wrap; gap: 4px; }
      #palette button { margin: 0; min-width: 40px; height: 40px; padding: 2px 4px; background: #fffdf3;
                        display: grid; place-items: center; font-weight: normal; font-size: 12px; }
      #palette button:hover { background: #fff4c9; }
      #palette button.on { background: #ffe9a8; box-shadow: inset 0 0 0 2px #402e3a; }
      #palette button.wanted { border-style: dashed; border-color: #b07a1e; background: #fff4c9; }
      #palette img { image-rendering: pixelated; }
      #tool-hint { margin: 10px 0 0; }
      .condition { background: #fffdf3; border: 1px dashed #c9b88f; padding: 4px 8px; margin: 8px 0; }
      .condition .stamp { margin: 2px 6px 2px 0; }
      #leave { margin-top: 14px; }
      #board li { cursor: pointer; padding: 2px 4px; margin: 0 -4px 6px; }
      #board li:hover, #board li.open { background: #fffdf3; }
      .exchange { margin: 6px 0 2px; padding: 6px 8px; border-top: 1px dashed #c9b88f; cursor: auto; }
      .swatch { display: inline-block; width: 10px; height: 10px; border: 2px solid #402e3a; margin-right: 6px; vertical-align: -1px; }
      .plot-link { margin: 2px 2px 0 0; padding: 1px 6px; background: #fffdf3; border-color: currentColor; }
      .plot-link:hover { background: #fff4c9; }
      .stamp.thunk { animation: thunk .45s cubic-bezier(.3, 1.6, .5, 1) both; }
      @keyframes thunk {
        from { transform: scale(2.4) rotate(-14deg); opacity: 0; }
        60% { transform: scale(.92) rotate(-1deg); opacity: 1; }
        to { transform: rotate(-2deg); }
      }
      #here { margin-top: 4px; }
      @media (max-width: 760px) {
        body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
        aside { border-left: 0; border-top: 3px solid #402e3a; }
      }
    </style>
  </head>
  <body>
    <main id="field"><canvas></canvas></main>
    <aside>
      <h1>The Commons</h1>
      <p class="meta">Administered by Gary.</p>
      <p id="here" class="meta"></p>
      <section id="plot"><p class="hint">Opening the gate…</p></section>
      <form id="claim" hidden>
        <textarea rows="2" maxlength="120" placeholder="a bench, for looking at the pond with" required></textarea>
        <button>Submit to Gary</button>
        <p id="problem"></p>
      </form>
      <section id="build" hidden>
        <div id="build-info"></div>
        <div id="tools">
          <p id="tool-hint" class="hint"></p>
          <div id="palette"></div>
          <p id="build-problem"></p>
        </div>
        <button id="leave">Back to the commons</button>
      </section>
      <section id="mine"></section>
      <section id="board"></section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
